[project]
name = "grant-radar"
version = "0.1.0"
description = "補助金・公募情報の収集基盤。取得前に必ず利用条件を確認し、公式APIがあるものはAPIを使う。"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
grant-radar = "grant_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grant_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 は「紛らわしいUnicode文字」の警告。全角の括弧や記号に反応する。
# このプロジェクトは日本語で書いており、全角記号は意図して使っているため無効化する。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
